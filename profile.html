
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Member Profile | Abia Connect</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #24313d;
    }

    header {
      background: #183b32;
      color: white;
      padding: 18px 20px;
    }

    header a {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    main {
      max-width: 650px;
      margin: 35px auto;
      padding: 0 16px;
    }

    .profile-card {
      background: white;
      padding: 28px;
      border-radius: 16px;
      box-shadow: 0 4px 18px #00000010;
    }

    .avatar {
      width: 90px;
      height: 90px;
      margin: 0 auto 14px;
      border-radius: 50%;
      background: #e4eee9;
      display: grid;
      place-items: center;
      font-size: 38px;
    }

    h1, .subtitle { text-align: center; }

    h1 { margin-bottom: 8px; }

    .subtitle { color: #687780; }

    .detail {
      padding: 16px 0;
      border-top: 1px solid #e8ecef;
    }

    .detail h2 {
      font-size: 16px;
      margin: 0 0 8px;
    }

    .detail p {
      margin: 0;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .actions {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }

    button {
      flex: 1;
      border: 0;
      border-radius: 10px;
      padding: 13px 10px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .love { background: #fce7ed; color: #b42350; }
    .message { background: #183b32; color: white; }

    .note {
      text-align: center;
      color: #687780;
      font-size: 13px;
      line-height: 1.5;
      margin-top: 18px;
    }

    @media (max-width: 420px) {
      .profile-card { padding: 20px; }
      .actions { flex-direction: column; }
    }
  </style>
</head>
<body>
  <header>
    <a href="home.html">← Back to Abia Connect</a>
  </header>

  <main>
    <section class="profile-card">
      <div class="avatar" aria-hidden="true">👤</div>
      <h1 id="memberName">Member Profile</h1>
      <p class="subtitle">Abia Connect community member</p>

      <div class="detail">
        <h2>About Me</h2>
        <p id="memberAbout">Profile description will appear here.</p>
      </div>

      <div class="detail">
        <h2>Location</h2>
        <p id="memberLocation">Location will appear here.</p>
      </div>

      <div class="actions">
        <button class="love" type="button" id="loveButton">❤️ Love</button>
        <button class="message" type="button" id="messageButton">
          💬 Start conversation
        </button>
      </div>

      <p class="note" id="connectionNote">
        Messaging becomes available when both members choose Love.
      </p>
    
    </section>

    <section class="profile-card" id="editProfileSection">
      <h2>Edit My Profile</h2>
      <p>Update your own member details below.</p>

      <form id="editProfileForm">
        <label for="editFullName">Full name</label>
        <input id="editFullName" type="text" required>

        <label for="editAge">Age</label>
        <input id="editAge" type="number" min="18" required>

        <label for="editGender">Gender</label>
        <input id="editGender" type="text" required>

        <label for="editLocation">Location</label>
        <input id="editLocation" type="text">

        <label for="editAbiaConnection">Abia connection</label>
        <input id="editAbiaConnection" type="text">

        <label for="editAboutMe">About me</label>
        <textarea id="editAboutMe" rows="4"></textarea>

        <button type="submit">Save Profile Changes</button>
        <p id="editProfileMessage" role="status"></p>
      </form>
    </section>
  </main>


  
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const PROFILE_SUPABASE_URL = "https://lkxzaubfoahpoptlncvp.supabase.co";
  const PROFILE_SUPABASE_KEY = "sb_publishable_jPGrPlV54UFgBXT22CQ5JA_cDnDn67c";

  const profileClient = window.supabase.createClient(
    PROFILE_SUPABASE_URL,
    PROFILE_SUPABASE_KEY
  );

  async function loadMemberProfile() {
    const params = new URLSearchParams(window.location.search);
    const memberId = params.get("id");

    const nameElement = document.getElementById("memberName");
    const aboutElement = document.getElementById("memberAbout");
    const locationElement = document.getElementById("memberLocation");
    const noteElement = document.getElementById("connectionNote");

    if (!memberId) {
      nameElement.textContent = "Member not found";
      aboutElement.textContent = "No member was selected.";
      locationElement.textContent = "Not available";
      return;
    }

    const { data: profile, error } = await profileClient
      .from("member_profiles")
      .select("full_name, about_me, location")
      .eq("id", memberId)
      .maybeSingle();

    if (error || !profile) {
      nameElement.textContent = "Profile unavailable";
      aboutElement.textContent = "This member's profile could not be loaded.";
      locationElement.textContent = "Not available";
      console.error("Profile loading error:", error?.message);
      return;
    }

    nameElement.textContent = profile.full_name || "Abia Connect Member";
    aboutElement.textContent = profile.about_me || "This member hasn't added a description yet.";
    locationElement.textContent = profile.location || "Not provided";
    noteElement.textContent =
      "Messaging becomes available when both members choose Love.";
  }

  loadMemberProfile();
  document.getElementById("loveButton").addEventListener("click", async function () {
  const params = new URLSearchParams(window.location.search);
  const receiverId = params.get("id");

  const { data: { user } } = await profileClient.auth.getUser();

  if (!user) {
    alert("Please sign in to choose Love.");
    return;
  }

  if (!receiverId || receiverId === user.id) {
    alert("You can choose Love on another member's profile, not your own.");
    return;
  }

  const { error } = await profileClient
    .from("member_connections")
    .upsert(
      { sender_id: user.id, receiver_id: receiverId },
      { onConflict: "sender_id,receiver_id", ignoreDuplicates: true }
    );

  if (error) {
    alert("Could not save your choice. Please try again.");
    console.error(error);
    return;
  }

  alert("Love saved! You've shown that you'd like to connect.");
});
  
  async function loadMyEditableProfile() {
  const { data: { user }, error: userError } =
    await profileClient.auth.getUser();

  const message = document.getElementById("editProfileMessage");

  if (userError || !user) {
    message.textContent = "Please sign in to edit your profile.";
    return;
  }

  const { data: profile, error } = await profileClient
    .from("member_profiles")
    .select("full_name, age, gender, location, abia_connection, about_me")
    .eq("id", user.id)
    .maybeSingle();

  if (error || !profile) {
    message.textContent = "Could not load your profile details.";
    console.error("Profile edit loading error:", error);
    return;
  }

  document.getElementById("editFullName").value = profile.full_name || "";
  document.getElementById("editAge").value = profile.age || "";
  document.getElementById("editGender").value = profile.gender || "";
  document.getElementById("editLocation").value = profile.location || "";
  document.getElementById("editAbiaConnection").value =
    profile.abia_connection || "";
  document.getElementById("editAboutMe").value = profile.about_me || "";
}

document.getElementById("editProfileForm").addEventListener(
  "submit",
  async function (event) {
    event.preventDefault();

    const message = document.getElementById("editProfileMessage");
    message.textContent = "Saving your changes...";

    const { data: { user }, error: userError } =
      await profileClient.auth.getUser();

    if (userError || !user) {
      message.textContent = "Please sign in before saving.";
      return;
    }

    const updates = {
      full_name: document.getElementById("editFullName").value.trim(),
      age: Number(document.getElementById("editAge").value),
      gender: document.getElementById("editGender").value.trim(),
      location: document.getElementById("editLocation").value.trim(),
      abia_connection:
        document.getElementById("editAbiaConnection").value.trim(),
      about_me: document.getElementById("editAboutMe").value.trim()
    };

    const { data, error } = await profileClient
      .from("member_profiles")
      .update(updates)
      .eq("id", user.id)
      .select();

    if (error) {
      message.textContent = "Could not save changes. Please try again.";
      console.error("Profile save error:", error);
      return;
    }

    if (!data || data.length === 0) {
      message.textContent =
        "No changes saved. Your profile update permission may need to be enabled.";
      return;
    }

    message.textContent = "Profile updated successfully!";
    loadMemberProfile();
  }
);

loadMyEditableProfile();
  
</script>
</body>

</body>
</html>
